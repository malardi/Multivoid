# build.yml -- the CI lane's entry (design D1/D2/D11). Based on PR #2 by
# huoyan1231 (thanks!) -- the vcpkg/CMake build steps he authored now live in
# build-core.yml, which this file dispatches; his authorship stays in this
# PR's history. Reworked per the maintainers' design: a THIN entry so the CI
# lane and the release lane share ONE build implementation (build-core@main,
# remote form on purpose -- a local-path uses: would resolve from the
# triggering branch).
#
# MANUAL ONLY, and deliberately: a ~20-minute Windows runner is the heaviest
# thing this project can ask for, and asking for it on
# every push spends it on commits that cannot reach the DLL. What the automatic
# lane was there to protect -- the source invariants -- is now checked by
# repo-gates.yml instead, which runs the same gate scripts on every push in
# about ten seconds and needs no compiler. Only the checks that genuinely
# require a built DLL wait for a dispatch: abi_gate.py (the D-3 slim contract,
# ZERO imported UE4SS symbols) and the package drill. The nightly cron stays
# dropped: a clock is not a reason to build.
# Artifacts are CI evidence, NOT distribution -- releases are the supported
# install channel.
name: build

# Fork lane (malardi/Multivoid): a push to coop-fixes builds by itself, and the publish job puts the built
# DLL and the mod-manager zip on the `builds` branch, one commit replaced each time, so the files can be
# fetched with git instead of downloaded by hand from the run page.
on:
  workflow_dispatch:
    inputs:
      cacheless:
        description: build without caches (the release-path smoke)
        required: false
        type: boolean
        default: false
  push:
    branches: [coop-fixes]
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: VOTV-MP/Multivoid/.github/workflows/build-core.yml@main
    with:
      ref: ${{ github.sha }}
      source-sha: ${{ github.sha }}
      use-cache: ${{ !inputs.cacheless }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Put the build on the builds branch
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir out
          find art -name main.dll -exec cp {} out/main.dll \;
          find art -name 'Pelmentor-Multivoid-*.zip' -exec cp {} out/ \;
          find art -name build-info.txt -exec cp {} out/ \;
          ls -la out
          test -f out/main.dll
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" builds
